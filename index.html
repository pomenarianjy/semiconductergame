<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Fab: Fully Workable Arcade Game</title>
    <style>
        body {
            background-color: #050512;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .arcade-cabinet {
            width: 100%;
            max-width: 600px;
            background-color: #0c0c2a;
            border: 4px solid #00ffcc;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            font-size: 1.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hud-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            background: rgba(0, 255, 204, 0.08);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            margin-bottom: 12px;
        }

        .hud-display span { color: #ff007f; }
        #score-val { color: #00ffcc; }

        .canvas-container {
            position: relative;
            width: 100%;
            padding-bottom: 66.66%; /* Fixed 3:2 Aspect Ratio */
            background-color: #010105;
            border: 2px solid #ff007f;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-button {
            width: 100%;
            background-color: #ff007f;
            color: white;
            padding: 18px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            margin-top: 15px;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        .action-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="header-title">SILICON FABRICATION ARCADE</div>
        
        <div class="hud-display">
            <div>SCORE: <span id="score-val">00000</span></div>
            <div>PHASE: <span id="stage-val">1/4: INTERFACE LOAD</span></div>
            <div>INTEGRITY: <span id="faults-val">⭐⭐⭐</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>

        <button class="action-button" id="ctrlBtn">TAP HERE TO START GAME</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CORE PROGRAMMATIC MACHINE ENGINE STATE ---
        let game = {
            mode: 'MENU',  // MENU, GATE, PLAYING, WIN, LOSE
            stage: 1,      // 1: Ingot, 2: Litho, 3: Doping, 4: Dicing
            score: 0,
            lives: 3,
            
            // Phase 1 Mechanics (Ingot Temperature Pulling)
            s1: { temp: 50, progress: 0 },
            // Phase 2 Mechanics (UV Lithography Reticle Tracking)
            s2: { x: 50, dir: 1, speed: 7, width: 100, flash: 0 },
            // Phase 3 Mechanics (Ion Implantation Node Purging)
            s3: { nodes: [], targetHits: 4, hitCount: 0, timeLimit: 8.0 },
            // Phase 4 Mechanics (Silicon Die Packaging Dicing Cuts)
            s4: { cuts: [], needed: 3, timeLimit: 7.0 }
        };

        // --- HARDWARE INPUT EVENT LISTENER BINDINGS ---
        const btn = document.getElementById('ctrlBtn');
        btn.addEventListener('click', processGlobalSystemInput);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); processGlobalSystemInput(); });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                processGlobalSystemInput();
            }
        });

        // Exact Local Canvas Coordinate Tracking Click/Tap System
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const clickY = ((e.clientY - rect.top) / rect.height) * canvas.height;

            handleCanvasCoordinateClicks(clickX, clickY);
        });

        function processGlobalSystemInput() {
            if (game.mode === 'MENU') {
                resetEngineDataStructures();
                game.mode = 'GATE';
                updateHudDisplays();
                return;
            }
            if (game.mode === 'GATE') {
                launchActiveStageEngine();
                return;
            }
            if (game.mode === 'WIN' || game.mode === 'LOSE') {
                game.mode = 'MENU';
                updateHudDisplays();
                return;
            }

            // CONTROLS FOR ACTIVE MODULE RUNS
            if (game.mode === 'PLAYING') {
                if (game.stage === 1) {
                    game.s1.temp += 9.5; // Inject upward thermal force kinetic thrust
                    if (game.s1.temp > 100) game.s1.temp = 100;
                }
                else if (game.stage === 2) {
                    game.s2.flash = 8; // Trigger neon burst flash overlay
                    
                    const targetCenter = 300;
                    const reticleCenter = game.s2.x + (game.s2.width / 2);
                    
                    // Programmatic evaluation of coordinate alignment boundaries
                    if (Math.abs(reticleCenter - targetCenter) < 55) {
                        game.score += 250;
                        transitionToNextStageGate(3);
                    } else {
                        triggerSystemFaultDataReset();
                    }
                }
            }
        }

        function handleCanvasCoordinateClicks(x, y) {
            // Check bounding boxes for the Launch button overlays inside the screen
            if (game.mode === 'GATE' && x > 200 && x < 400 && y > 210 && y < 260) {
                launchActiveStageEngine();
                return;
            }
            if (game.mode === 'WIN' || game.mode === 'LOSE' || game.mode === 'MENU') {
                processGlobalSystemInput();
                return;
            }
            if (game.mode !== 'PLAYING') return;

            // STAGE 3: INTERACTIVE DOPING FIELD TAP CONSTRAINTS
            if (game.stage === 3) {
                for (let i = game.s3.nodes.length - 1; i >= 0; i--) {
                    let n = game.s3.nodes[i];
                    let distance = Math.hypot(n.x - x, n.y - y);
                    
                    if (distance < n.r) {
                        if (n.type === 'N') {
                            game.s3.nodes.splice(i, 1);
                            game.score += 50;
                            game.s3.hitCount++;
                            if (game.s3.hitCount >= game.s3.targetHits) {
                                transitionToNextStageGate(4);
                            }
                        } else {
                            triggerSystemFaultDataReset();
                        }
                        break;
                    }
                }
            }

            // STAGE 4: INTERACTIVE PACKAGING MATRIX DICING LINES
            if (game.stage === 4) {
                if (x > 180 && x < 420 && y > 90 && y < 310) {
                    game.s4.cuts.push({ x: x, y: y });
                    game.score += 100;
                    if (game.s4.cuts.length >= game.s4.needed) {
                        game.mode = 'WIN';
                    }
                    updateHudDisplays();
                }
            }
        }

        function launchActiveStageEngine() {
            game.mode = 'PLAYING';
            if (game.stage === 1) { game.s1.temp = 50; game.s1.progress = 0; }
            if (game.stage === 2) { game.s2.x = 50; game.s2.dir = 1; }
            if (game.stage === 3) { game.s3.hitCount = 0; game.s3.timeLimit = 8.0; seedStageThreeNodes(); }
            if (game.stage === 4) { game.s4.cuts = []; game.s4.timeLimit = 7.0; }
            updateHudDisplays();
        }

        function seedStageThreeNodes() {
            game.s3.nodes = [];
            for (let i = 0; i < 7; i++) {
                game.s3.nodes.push({
                    x: Math.random() * 420 + 90,
                    y: Math.random() * 200 + 100,
                    r: 25,
                    type: Math.random() > 0.45 ? 'N' : 'P'
                });
            }
            let checkCount = game.s3.nodes.filter(n => n.type === 'N').length;
            if (checkCount < game.s3.targetHits) {
                game.s3.nodes.forEach(n => n.type = 'N');
            }
        }

        function triggerSystemFaultDataReset() {
            game.lives--;
            game.mode = 'GATE';
            if (game.lives <= 0) game.mode = 'LOSE';
            updateHudDisplays();
        }

        function transitionToNextStageGate(nextIdx) {
