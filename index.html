<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Fab: Online Arcade Engine</title>
    <!-- Standardized Online Game Engine Framework -->
    <script src="https://jsdelivr.net"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #03030a;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }
        #game-wrapper {
            border: 4px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            background: #000;
        }
    </style>
</head>
<body>

    <div id="game-wrapper"></div>

    <script>
        // --- CORE PHASER ENGINE CONFIG ---
        const config = {
            type: Phaser.AUTO,
            width: 750,
            height: 460,
            parent: 'game-wrapper',
            backgroundColor: '#050518',
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // --- GLOBAL MACHINE STATE VARIABLES ---
        let gameState = 'MENU'; // MENU, GATE, PLAYING, END_WIN, END_LOSE
        let stageIndex = 1;      // 1 to 4 sequential stages
        let gameScore = 0;
        let livesLeft = 3;

        // Stage-Specific Mechanics State
        let s1Temperature = 50;
        let s1TargetHoldTime = 0;
        let s2VelocityX = 300;
        let s2MovingRight = true;
        let s3TargetCyanNodes = 0;
        let s4CutsMade = 0;

        // Object Elements
        let scoreTextText, livesTextText, stageTextText, statusFooterText, actionButtonHitbox, spacebarKeyObj;
        let groupS1, groupS2, groupS3, groupS4, menuContainer, gateContainer;
        let pinS1, reticleS2, waferS2, gridS4, bladeS4, emitterGroup;

        function preload() {}

        function create() {
            // Instantiate Render Containers
            menuContainer = this.add.group();
            gateContainer = this.add.group();
            groupS1 = this.add.group();
            groupS2 = this.add.group();
            groupS3 = this.add.group();
            groupS4 = this.add.group();

            // Render Core HUD Panel
            this.add.rectangle(375, 25, 750, 50, 0x0c0c2a).setOrigin(0.5);
            scoreTextText = this.add.text(25, 16, 'SCORE: 00000', { fontSize: '16px', fill: '#00ffcc', fontFamily: 'monospace' });
            stageTextText = this.add.text(260, 16, 'PHASE 1: SILICON CRYSTAL', { fontSize: '16px', fill: '#ffffff', fontFamily: 'monospace', fontWeight: 'bold' });
            livesTextText = this.add.text(620, 16, 'LIVES: ⭐⭐⭐', { fontSize: '16px', fill: '#ff007f', fontFamily: 'monospace' });

            statusFooterText = this.add.text(375, 395, 'Initialize system modules...', { fontSize: '13px', fill: '#8899aa', fontFamily: 'monospace' }).setOrigin(0.5);

            // Render Big Lower Control Bar
            actionButtonHitbox = this.add.rectangle(375, 435, 730, 40, 0xff007f)
                .setInteractive()
                .on('pointerdown', () => processGlobalActionClick(this));
            this.add.text(375, 435, '⚙️ CLICK HERE OR PRESS [SPACEBAR] TO INTERACT ⚙️', { fontSize: '14px', fill: '#ffffff', fontFamily: 'monospace', fontWeight: 'bold' }).setOrigin(0.5);

            // Connect Spacebar Key Bindings
            spacebarKeyObj = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
            this.input.keyboard.on('keydown-SPACE', (e) => {
                e.preventDefault();
                processGlobalActionClick(this);
            });

            // Create Canvas Vector Particle Texture Emitter
            emitterGroup = this.add.particles(0, 0, buildSparkTexture(this), {
                speed: { min: 80, max: 160 },
                scale: { start: 1, end: 0 },
                blendMode: 'ADD',
                lifespan: 400,
                quantity: 10,
                active: false
            });

            // Build out sub-scenes and show Main Menu
            constructStageLayouts(this);
            drawMainMenuLayer(this);
        }

        function buildSparkTexture(scene) {
            let canvas = document.createElement('canvas');
            canvas.width = 6; canvas.height = 6;
            let ctx = canvas.getContext('2d');
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(0, 0, 6, 6);
            scene.textures.addCanvas('sparkTex', canvas);
            return 'sparkTex';
        }

        function drawMainMenuLayer(scene) {
            gameState = 'MENU';
            toggleStageLayerVisibility(false, false, false, false);
            gateContainer.clear(true, true);

            let title = scene.add.text(375, 160, 'SILICON FAB: ONLINE ARCADE', { fontSize: '28px', fill: '#00ffcc', fontFamily: 'monospace', fontWeight: 'bold' }).setOrigin(0.5);
            let desc = scene.add.text(375, 210, 'Standardized Multi-Phase Fabrication Game Engine', { fontSize: '15px', fill: '#778899', fontFamily: 'monospace' }).setOrigin(0.5);
            
            let btnBox = scene.add.rectangle(375, 290, 200, 50, 0x00ffcc).setInteractive();
            let btnTxt = scene.add.text(375, 290, 'START GAME', { fontSize: '18px', fill: '#050512', fontFamily: 'monospace', fontWeight: 'bold' }).setOrigin(0.5);

            btnBox.on('pointerdown', () => {
                title.destroy(); desc.destroy(); btnBox.destroy(); btnTxt.destroy();
                gameScore = 0; livesLeft = 3; stageIndex = 1;
                refreshHudMetrics();
                loadStageGateOverlay(scene);
            });

            menuContainer.add([title, desc, btnBox, btnTxt]);
        }

        function loadStageGateOverlay(scene) {
            gameState = 'GATE';
            toggleStageLayerVisibility(false, false, false, false);
            gateContainer.clear(true, true);

            const subTitles = ["", "PHASE 1: CRYSTAL PULLING", "PHASE 2: UV LITHOGRAPHY", "PHASE 3: ION IMPLANTATION", "PHASE 4: MATRIX CHIP DICING"];
            let t = scene.add.text(375, 150, subTitles[stageIndex], { fontSize: '22px', fill: '#ffffff', fontFamily: 'monospace', fontWeight: 'bold' }).setOrigin(0.5);
            
            let b = scene.add.rectangle(375, 260, 200, 50, 0xff007f).setInteractive();
            let l = scene.add.text(375, 260, 'LAUNCH MODULE', { fontSize: '16px', fill: '#ffffff', fontFamily: 'monospace', fontWeight: 'bold' }).setOrigin(0.5);

            b.on('pointerdown', () => {
                t.destroy(); b.destroy(); l.destroy();
                gameState = 'PLAYING';

                if (stageIndex === 1) { s1Temperature = 50; s1TargetHoldTime = 0; toggleStageLayerVisibility(true, false, false, false); }
                if (stageIndex === 2) { reticleS2.x = 120; s2MovingRight = true; toggleStageLayerVisibility(false, true, false, false); }
                if (stageIndex === 3) { generateImplantationMatrix(scene); toggleStageLayerVisibility(false, false, true, false); }
                if (stageIndex === 4) { s4CutsMade = 0; toggleStageLayerVisibility(false, false, false, true); }
                
                refreshHudMetrics();
            });

            gateContainer.add([t, b, l]);
        }

        function constructStageLayouts(scene) {
            // Stage 1 Vectors
            let s1Bg = scene.add.rectangle(375, 220, 460, 24, 0x22223b).setOrigin(0.5);
            let s1Zone = scene.add.rectangle(375, 220, 140, 24, 0x00ffcc, 0.45).setOrigin(0.5);
            pinS1 = scene.add.rectangle(375, 220, 16, 40, 0xff007f).setOrigin(0.5);
            groupS1.add([s1Bg, s1Zone, pinS1]);

            // Stage 2 Vectors
            waferS2 = scene.add.circle(375, 220, 65, 0x00ffff, 0.35);
            reticleS2 = scene.add.rectangle(150, 220, 120, 120).setStrokeStyle(4, 0xff007f);
            groupS2.add([waferS2, reticleS2]);

            // Stage 4 Vectors
            gridS4 = scene.add.rectangle(375, 220, 220, 220, 0x0b0b26).setStrokeStyle(3, 0x00ffcc).setInteractive();
            bladeS4 = scene.add.circle(375, 220, 15, 0xffbb00).setVisible(false);
            
            gridS4.on('pointerdown', (pointer) => {
                if (gameState !== 'PLAYING' || stageIndex !== 4) return;
                bladeS4.setVisible(true);
                bladeS4.x = pointer.x; bladeS4.y = pointer.y;
                emitterGroup.emitParticleAt(pointer.x, pointer.y);

                s4CutsMade++;
                gameScore += 150;
                refreshHudMetrics();

                if (s4CutsMade >= 3) {
                    gameState = 'END_WIN';
                    triggerEndSequenceScene(scene, true);
                }
            });
            groupS4.add([gridS4, bladeS4]);
        }

        function toggleStageLayerVisibility(s1, s2, s3, s4) {
            groupS1.setVisible(s1); groupS2.setVisible(s2); groupS3.setVisible(s3); groupS4.setVisible(s4);
            if (!s3) groupS3.clear(true, true);
        }

        function refreshHudMetrics() {
            scoreTextText.setText('SCORE: ' + String(gameScore).padStart(5, '0'));
            let stars = '';
            for (let i = 0; i < 3; i++) stars += (i < livesLeft) ? '⭐' : '❌';
            livesTextText.setText('LIVES: ' + stars);

            const heads = ["", "PHASE 1: CRYSTAL PULL", "PHASE 2: UV SHOT", "PHASE 3: ION DOPING", "PHASE 4: DICING SILICON"];
            stageTextText.setText(heads[stageIndex]);

            if (gameState === 'PLAYING') {
