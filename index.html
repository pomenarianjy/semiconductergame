<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Fab: Pure Arcade Engine</title>
    <style>
        body {
            background-color: #03030a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        .cabinet {
            width: 100%;
            max-width: 600px;
            background-color: #0a0a1c;
            border: 4px solid #00ffcc;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .header {
            text-align: center;
            font-size: 1.4rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            font-weight: bold;
            margin-bottom: 10px;
        }
        .hud-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            background: rgba(0, 255, 204, 0.08);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            margin-bottom: 12px;
        }
        .hud-bar span { color: #ff007f; }
        #score-val { color: #00ffcc; }
        .canvas-container {
            position: relative;
            width: 100%;
            padding-bottom: 66.66%; /* Fixed 3:2 Aspect Ratio */
            background-color: #010105;
            border: 2px solid #ff007f;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .action-button {
            width: 100%;
            background-color: #ff007f;
            color: white;
            padding: 18px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            margin-top: 15px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .action-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="cabinet">
        <div class="header">SILICON FABRICATION PRO</div>
        
        <div class="hud-bar">
            <div>SCORE: <span id="score-val">00000</span></div>
            <div>PHASE: <span id="stage-val">1/4: INGOT</span></div>
            <div>INTEGRITY: <span id="faults-val">⭐⭐⭐</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>

        <button class="action-button" id="ctrlBtn">INTERACT COMMAND [SPACEBAR]</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CORE GAME STATE OBJECT ---
        let game = {
            mode: 'MENU', // MENU, GATE, PLAYING, WIN, LOSE
            stage: 1,      // 1: Ingot, 2: Litho, 3: Doping, 4: Dicing
            score: 0,
            lives: 3,
            
            // Stage 1 Physics (Silicon Ingot Pulling)
            s1: { temp: 50, progress: 0 },
            // Stage 2 Physics (UV Lithography Exposure)
            s2: { x: 50, dir: 1, speed: 6.5, width: 100, flash: 0 },
            // Stage 3 Map (Ion Implantation Fields)
            s3: { nodes: [], targetHits: 4, hitCount: 0, timeLimit: 8.0 },
            // Stage 4 Map (Micro-die Packaging Dicing)
            s4: { cuts: [], needed: 3, timeLimit: 7.0 }
        };

        // --- UNIFIED HARDWARE EVENT HOOKS ---
        const btn = document.getElementById('ctrlBtn');
        btn.addEventListener('click', handleGlobalInput);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleGlobalInput(); });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleGlobalInput();
            }
        });

        // Direct Scaling Mouse Pointer / Screen Tap Handler
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            // Translate layout pixel geometry directly onto the game logic resolution coordinates
            const rect = canvas.getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const clickY = ((e.clientY - rect.top) / rect.height) * canvas.height;

            handleCanvasClickEvents(clickX, clickY);
        });

        function handleGlobalInput() {
            if (game.mode === 'MENU') {
                resetEngineData();
                game.mode = 'GATE';
                updateHudDisplays();
                return;
            }
            if (game.mode === 'GATE') {
                launchActiveStageEngine();
                return;
            }
            if (game.mode === 'WIN' || game.mode === 'LOSE') {
                game.mode = 'MENU';
                updateHudDisplays();
                return;
            }

            // CONTROLS FOR ACTIVE MODULE RUNS
            if (game.mode === 'PLAYING') {
                if (game.stage === 1) {
                    game.s1.temp += 9.5; // Inject upward thermal mass kinetic velocity
                    if (game.s1.temp > 100) game.s1.temp = 100;
                }
                else if (game.stage === 2) {
                    game.s2.flash = 8; // Trigger bright laser visual overlay flash
                    
                    const targetCenter = 300;
                    const reticleCenter = game.s2.x + (game.s2.width / 2);
                    
                    // Direct programmatic evaluation of overlap accuracy boundaries
                    if (Math.abs(reticleCenter - targetCenter) < 50) {
                        game.score += 250;
                        transitionToNextStageGate(3);
                    } else {
                        triggerSystemFault();
                    }
                }
            }
        }

        function handleCanvasClickEvents(x, y) {
            // Register interaction bounds for the in-screen "Launch" button overlay
            if (game.mode === 'GATE' && x > 200 && x < 400 && y > 210 && y < 260) {
                launchActiveStageEngine();
                return;
            }
            if (game.mode === 'WIN' || game.mode === 'LOSE' || game.mode === 'MENU') {
                handleGlobalInput();
                return;
            }
            if (game.mode !== 'PLAYING') return;

            // STAGE 3: CHEMICALLY DOPED ION FIELD HIT DETECTOR
            if (game.stage === 3) {
                for (let i = game.s3.nodes.length - 1; i >= 0; i--) {
                    let n = game.s3.nodes[i];
                    let distance = Math.hypot(n.x - x, n.y - y);
                    
                    if (distance < n.r) {
                        if (n.type === 'N') {
                            game.s3.nodes.splice(i, 1);
                            game.score += 50;
                            game.s3.hitCount++;
                            if (game.s3.hitCount >= game.s3.targetHits) {
                                transitionToNextStageGate(4);
                            }
                        } else {
                            triggerSystemFault();
                        }
                        break;
                    }
                }
            }

            // STAGE 4: SILICON DIE PACKAGING DICING CUTS
            if (game.stage === 4) {
                if (x > 180 && x < 420 && y > 90 && y < 310) {
                    game.s4.cuts.push({ x: x, y: y });
                    game.score += 100;
                    if (game.s4.cuts.length >= game.s4.needed) {
                        game.mode = 'WIN';
                    }
                    updateHudDisplays();
                }
            }
        }

        function launchActiveStageEngine() {
            game.mode = 'PLAYING';
            if (game.stage === 1) { game.s1.temp = 50; game.s1.progress = 0; }
            if (game.stage === 2) { game.s2.x = 50; game.s2.dir = 1; }
            if (game.stage === 3) { game.s3.hitCount = 0; game.s3.timeLimit = 8.0; seedStageThreeNodes(); }
            if (game.stage === 4) { game.s4.cuts = []; game.s4.timeLimit = 7.0; }
            updateHudDisplays();
        }

        function seedStageThreeNodes() {
            game.s3.nodes = [];
            for (let i = 0; i < 7; i++) {
                game.s3.nodes.push({
                    x: Math.random() * 420 + 90,
                    y: Math.random() * 200 + 100,
                    r: 25,
                    type: Math.random() > 0.45 ? 'N' : 'P'
                });
            }
            let checkCount = game.s3.nodes.filter(n => n.type === 'N').length;
            if (checkCount < game.s3.targetHits) {
                game.s3.nodes.forEach(n => n.type = 'N');
            }
        }

        function triggerSystemFault() {
            game.lives--;
            game.mode = 'GATE';
            if (game.lives <= 0) game.mode = 'LOSE';
            updateHudDisplays();
        }

        function transitionToNextStageGate(nextIdx) {
            game.stage = nextIdx;
            game.mode = 'GATE';
            updateHudDisplays();
        }

        function resetEngineData() {
